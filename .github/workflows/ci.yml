name: Build Latest Task

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install dependencies
      run: sudo apt-get install -y cmake build-essential

    - name: Find the latest changed task folder
      id: finder
      run: |
        LATEST_FOLDER=$(git log --pretty=format: --name-only --diff-filter=AM | \
                        grep -E '^lab[0-9]+/[0-9]+/[^/]+$' | \
                        sort -u | \
                        tail -1 | \
                        xargs dirname)
        
        if [ -z "$LATEST_FOLDER" ]; then
          echo "folder=none" >> $GITHUB_OUTPUT
          exit 0
        fi

        echo "Latest changed folder: $LATEST_FOLDER"
        echo "folder=$LATEST_FOLDER" >> $GITHUB_OUTPUT

    - name: Build
      if: steps.finder.outputs.folder != 'none'
      run: |
        cd ${{ steps.finder.outputs.folder }}
        mkdir -p build && cd build
        cmake ../
        make

    - name: Test each line
      if: steps.finder.outputs.folder != 'none'
      run: |
        cd ${{ steps.finder.outputs.folder }}
        
        INPUT="tests/input.txt"
        OUTPUT="tests/output.txt"
        EXEC="./build/task"
        
        N_IN=$(wc -l < $INPUT)
        N_OUT=$(wc -l < $OUTPUT)
        
        if [ "$N_IN" != "$N_OUT" ]; then
          echo "❌ Количество строк в input.txt ($N_IN) и output.txt ($N_OUT) не совпадает"
          exit 1
        fi
        
        FAILED=0
        for I in $(seq 1 $N_IN); do
          INPUT_LINE=$(sed -n "${I}p" $INPUT)
          EXPECTED_LINE=$(sed -n "${I}p" $OUTPUT)
          
          echo "=== Тест $I ==="
          echo "Вход: $INPUT_LINE"
          echo "Ожидается: $EXPECTED_LINE"
          
          ACTUAL=$(echo "$INPUT_LINE" | $EXEC)
          echo "Получено: $ACTUAL"
          
          if [ "$ACTUAL" = "$EXPECTED_LINE" ]; then
            echo "✅ OK"
          else
            echo "❌ FAILED"
            FAILED=1
          fi
          echo ""
        done
        
        if [ $FAILED -eq 1 ]; then
          echo "Один или несколько тестов провалены"
          exit 1
        fi
